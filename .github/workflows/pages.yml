name: Deploy to GitHub Pages

# GitHub Pages cannot run the generator on its own — its default mode
# treats the repository as a Jekyll site and publishes README.md. This
# workflow runs `python3 build.py` and publishes dist/ instead.
#
# A project Pages site is served from /<repo>/, so the build is given
# BASE_PATH; otherwise every absolute path would 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The repository carries a CNAME, so the site is served from the
      # domain root. No BASE_PATH — adding one would point every link at
      # a sub-directory that does not exist on the domain.
      - name: Build
        run: |
          DOMAIN="$(cat CNAME | tr -d '[:space:]')"
          SITE_ORIGIN="https://$DOMAIN" python3 build.py
          cp CNAME dist/CNAME

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
