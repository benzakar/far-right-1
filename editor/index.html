<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>محرر fromparty.com</title>
  <link rel="stylesheet" href="/css/fonts-ar.css">
  <link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="/img/party-logo.png" alt=""><div><strong>محرر الموقع</strong><span>fromparty.com</span></div></div>
    <label class="page-picker">الصفحة<select id="page"></select></label>
    <nav class="mode-nav">
      <button class="active" data-view="click">اختار من المعاينة</button>
      <button data-view="sections">إعدادات مقاطع الرئيسية</button>
      <button data-view="blocks">النصوص والصور داخل المقاطع</button>
      <button data-view="theme">ألوان الموقع والزوايا</button>
    </nav>
    <nav id="sections" hidden></nav>
    <p class="security">كيخدم غير فهاد الحاسوب على 127.0.0.1</p>
  </aside>

  <main>
    <header class="toolbar">
      <div><h1 id="view-title">اختار من المعاينة</h1><p id="status">حمّلنا الإعدادات…</p></div>
      <div class="actions">
        <button id="preview">شوف المعاينة</button>
        <button id="save" class="primary">حفظ وبناء المعاينة</button>
        <button id="publish" class="danger">نشر فـ GitHub</button>
      </div>
    </header>

    <section id="form" class="editor-card"></section>
    <section class="preview-card">
      <div class="preview-head"><strong>المعاينة المحلية</strong><span>كتتبدل من بعد الحفظ</span></div>
      <iframe id="frame" src="/preview/"></iframe>
    </section>
  </main>

  <template id="section-template">
    <div class="grid">
      <label>الاسم داخل المحرر<input data-field="name"></label>
      <label>لون خلفية المقطع<select data-field="background"><option value="green">أخضر</option><option value="red">أحمر</option></select></label>
      <label class="wide">العنوان الصغير<input data-field="label"></label>
      <label class="wide">العنوان الكبير<textarea data-field="title" rows="2"></textarea></label>
      <label class="wide">المقدمة<textarea data-field="lead" rows="3"></textarea></label>
      <label class="wide">اقتباس اختياري<textarea data-field="quote" rows="3" placeholder="خليه خاوي إلا ما بغيتيش اقتباس"></textarea></label>
      <fieldset class="wide tweet"><legend><label class="switch"><input type="checkbox" data-tweet="enabled"> زيد تغريدة تحت صندوق النص</label></legend>
        <div class="grid">
          <label>الاسم<input data-tweet="name"></label><label>الحساب<input data-tweet="handle" dir="ltr"></label>
          <label class="wide">نص التغريدة<textarea data-tweet="text" rows="4"></textarea></label>
          <label>التاريخ<input data-tweet="date" dir="ltr"></label><label>رابط X<input data-tweet="url" dir="ltr"></label>
          <label class="wide">صورة الحساب<input data-tweet="avatar" dir="ltr" placeholder="/img/..."></label>
        </div>
      </fieldset>
    </div>
  </template>
  <template id="click-template">
    <div id="selection-empty" class="selection-empty">كليكي على عنوان، فقرة، صورة، زر، بطاقة، أو مقطع فالمعاينة. الأدوات ديالو غادي يبانوا هنا.</div>
    <div id="selection-controls" hidden>
      <p class="selection-kicker">العنصر المختار</p><h2 id="selection-name"></h2>
      <div class="grid">
        <label class="wide" id="text-field">النص<textarea id="selected-text" rows="5"></textarea></label>
        <fieldset class="wide tweet"><legend>الخط</legend><div class="chips">
          <button type="button" data-style="font-size" data-value="0.85em">صغير</button><button type="button" data-style="font-size" data-value="1em">عادي</button><button type="button" data-style="font-size" data-value="1.25em">كبير</button><button type="button" data-style="font-size" data-value="1.6em">كبير بزاف</button>
          <button type="button" data-style="font-weight" data-value="700">غامق</button><button type="button" data-style="font-weight" data-value="400">عادي</button>
        </div></fieldset>
        <fieldset class="wide tweet"><legend>اللون</legend><div class="chips colors">
          <button type="button" data-style="color" data-value="var(--green-deep)">أخضر</button><button type="button" data-style="color" data-value="var(--madder)">أحمر</button><button type="button" data-style="color" data-value="var(--gold)">ذهبي</button><button type="button" data-style="color" data-value="var(--ink)">أسود</button><button type="button" data-style="color" data-value="var(--ivory-0)">أبيض</button>
        </div></fieldset>
        <fieldset class="wide tweet" id="box-tools"><legend>الصندوق أو المقطع</legend><div class="chips">
          <button type="button" data-style="border-color" data-value="var(--green)">حد أخضر</button><button type="button" data-style="border-color" data-value="var(--madder)">حد أحمر</button><button type="button" data-style="border-color" data-value="var(--gold)">حد ذهبي</button>
          <button type="button" data-style="border-radius" data-value="28px">مدوّر</button><button type="button" data-style="border-radius" data-value="2px">مربّع</button>
          <button type="button" data-section-tone="green">خلفية خضرا</button><button type="button" data-section-tone="red">خلفية حمرا</button>
        </div></fieldset>
        <fieldset class="wide tweet" id="image-tools"><legend>الصورة</legend><div class="grid"><label class="wide">المسار<input id="selected-src" dir="ltr"></label><label class="wide">حمّل صورة<input id="selected-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label></div></fieldset>
        <fieldset class="wide tweet" id="link-tools"><legend>الرابط</legend><label>الرابط<input id="selected-href" dir="ltr"></label></fieldset>
        <label class="switch wide" id="quote-tool"><input id="selected-quote" type="checkbox"> حوّل الفقرة لاقتباس</label>
      </div>
    </div>
  </template>
  <template id="block-template">
    <div class="grid">
      <label class="wide">اختار صندوق الصورة والنص<select id="block-select"></select></label>
      <label class="wide">العنوان الصغير<input data-block="eyebrow"></label>
      <label class="wide">العنوان الكبير<textarea data-block="title" rows="2"></textarea></label>
      <label class="wide">النص — فرّق بين الفقرات بسطر خاوي<textarea data-block="body" rows="9"></textarea></label>
      <fieldset class="wide tweet"><legend>الصورة</legend>
        <div class="grid"><label class="wide">المسار الحالي<input id="image-path" dir="ltr" placeholder="/img/editor/..."></label>
        <label class="wide">حمّل صورة جديدة<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label></div>
      </fieldset>
    </div>
  </template>
  <script src="/editor/editor.js"></script>
</body>
</html>
