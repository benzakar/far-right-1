<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>محرر المقالات — fromparty.com</title>
  <link rel="stylesheet" href="/css/fonts-ar.css">
  <link rel="stylesheet" href="/editor/editor.css">
  <link rel="stylesheet" href="/editor/articles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="/img/party-logo.png" alt="">
      <div><strong>محرر المقالات</strong><span>fromparty.com</span></div>
    </div>

    <button id="new" class="new-article">+ مقال جديد</button>

    <nav id="list" class="article-list" aria-label="لائحة المقالات"></nav>

    <p class="security">كيخدم غير فهاد الحاسوب على 127.0.0.1</p>
    <p class="security"><a href="/editor/">← رجع لمحرر الموقع</a></p>
  </aside>

  <main>
    <header class="toolbar">
      <div>
        <h1 id="view-title">المقالات</h1>
        <p id="status">كنحمّل…</p>
      </div>
      <div class="actions">
        <button id="preview">شوف المقال</button>
        <button id="save" class="primary">حفظ وبناء المعاينة</button>
        <button id="publish" class="danger">نشر فـ GitHub</button>
      </div>
    </header>

    <section id="editor" class="editor-card" hidden>
      <div class="grid2">
        <label>العنوان
          <input id="f-title" type="text" placeholder="عنوان المقال بالدارجة">
        </label>
        <label>الرابط (slug)
          <input id="f-slug" type="text" dir="ltr" placeholder="my-article" pattern="[a-z0-9-]+">
        </label>
      </div>

      <div class="grid2">
        <label>التاريخ
          <input id="f-date" type="date">
        </label>
        <label>الكلمات المفتاحية بالإنجليزية <small>(مفصولة بفاصلة)</small>
          <input id="f-keywords" type="text" dir="ltr" placeholder="morocco, policy, migration">
        </label>
      </div>

      <label>ملخص قصير
        <textarea id="f-summary" rows="2" placeholder="جملة ولا جوج كيبانو فاللائحة"></textarea>
      </label>

      <label>الصورة الرئيسية
        <div class="imgrow">
          <input id="f-image" type="text" dir="ltr" placeholder="/img/from-002.png">
          <input id="f-file" type="file" accept="image/*" hidden>
          <button type="button" id="f-upload">رفع صورة</button>
        </div>
      </label>

      <h2 class="blocks-title">محتوى المقال</h2>
      <div id="blocks" class="blocks"></div>

      <div class="addrow">
        <button type="button" data-add="p">+ فقرة</button>
        <button type="button" data-add="h3">+ عنوان فرعي</button>
        <button type="button" data-add="quote">+ اقتباس</button>
        <button type="button" data-add="note">+ ملاحظة/حالة</button>
        <button type="button" data-add="image">+ صورة</button>
        <button type="button" data-add="embed">+ فيديو / سوشل ميديا</button>
      </div>

      <div class="dangerzone">
        <button type="button" id="delete" class="danger">حيّد هاد المقال</button>
      </div>
    </section>

    <section id="empty" class="editor-card">
      <p>ما كاين حتى مقال مختار. اختار واحد من اللائحة، ولا زيد جديد.</p>
    </section>
  </main>

  <script src="/editor/articles.js"></script>
</body>
</html>
